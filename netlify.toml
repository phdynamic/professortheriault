# Netlify build settings: rebuilds the site on every push to main.
[build]
  command = "npx @11ty/eleventy"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Serve the EthicsLens project site (hosted on GitHub Pages) under /ethicslens/.
# Without a trailing slash its relative stylesheet and script links would break, but Netlify treats
# /ethicslens and /ethicslens/ as the same address (a redirect to the slash form loops), so send
# the slash-less address to the index file instead.
[[redirects]]
  from = "/ethicslens"
  to = "/ethicslens/index.html"
  status = 301
  force = true

[[redirects]]
  from = "/ethicslens/*"
  to = "https://phdynamic.github.io/ethicslens/:splat"
  status = 200
  force = true
