# Netlify build settings: rebuilds the site on every push to main.
[build]
  command = "npx @11ty/eleventy"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/ethicslens"
  to = "/ethicslens/"
  status = 301

[[redirects]]
  from = "/ethicslens/*"
  to = "https://phdynamic.github.io/ethicslens/:splat"
  status = 200
  force = true
